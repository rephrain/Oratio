services:
  db:
    image: postgres:16-alpine
    container_name: oratio-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: oratio
      POSTGRES_USER: oratio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oratio_dev_password}
    volumes:
      - oratio-pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oratio -d oratio" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oratio-app-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://oratio:${POSTGRES_PASSWORD:-oratio_dev_password}@db:5432/oratio
      JWT_SECRET: ${JWT_SECRET}
      SATUSEHAT_ENV: ${SATUSEHAT_ENV:-staging}
      SATUSEHAT_CLIENT_ID: ${SATUSEHAT_CLIENT_ID}
      SATUSEHAT_CLIENT_SECRET: ${SATUSEHAT_CLIENT_SECRET}
      SATUSEHAT_ORG_ID: ${SATUSEHAT_ORG_ID}
      SNOWSTORM_BASE_URL: ${SNOWSTORM_BASE_URL}
      ENABLE_CRON: "false"
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  oratio-pgdata-dev:
